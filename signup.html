<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Chatter – a haven for text-based content." />
  <title>Sign up – Chatter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-header"></div>

  <main class="auth">
    <aside class="auth-side">
      <h2>Write, read and connect</h2>
      <p>Join a community of writers and readers who share your interests.</p>
    </aside>
    <section class="auth-main">
      <div class="auth-box">
        <h1>Create your account</h1>
        <p class="sub">It takes less than a minute.</p>
        <form data-form="signup" novalidate>
          <div class="field"><label for="name">Full name</label>
            <input id="name" name="name" type="text" autocomplete="name" placeholder="Jane Doe" /><span class="error"></span></div>
          <div class="field"><label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" /><span class="error"></span></div>
          <div class="field"><label for="password">Password</label>
            <div class="pw-wrap"><input id="password" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" /><button type="button">Show</button></div>
            <span class="error"></span></div>
          <div class="field"><label for="confirm">Confirm password</label>
            <input id="confirm" name="confirm" type="password" autocomplete="new-password" placeholder="Repeat password" /><span class="error"></span></div>
          <button class="btn btn-primary btn-block" type="submit">Sign up</button>
          <p class="form-msg" role="status"></p>
        </form>
        <p class="switch">Already have an account? <a href="login.html">Log in</a></p>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="js/main.js"></script>
</body>
</html>
