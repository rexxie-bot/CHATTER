<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Chatter – a haven for text-based content." />
  <title>Log in – Chatter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-header"></div>

  <main class="auth">
    <aside class="auth-side">
      <h2>Welcome back to Chatter</h2>
      <p>Pick up where you left off. Your drafts, readers and conversations are waiting.</p>
    </aside>
    <section class="auth-main">
      <div class="auth-box">
        <h1>Log in</h1>
        <p class="sub">Enter your details to access your account.</p>
        <form data-form="login" novalidate>
          <div class="field"><label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" />
            <span class="error"></span></div>
          <div class="field"><label for="password">Password</label>
            <div class="pw-wrap"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" /><button type="button">Show</button></div>
            <span class="error"></span></div>
          <div class="row"><label><input type="checkbox" /> Remember me</label><a href="#">Forgot password?</a></div>
          <button class="btn btn-primary btn-block" type="submit">Log in</button>
          <p class="form-msg" role="status"></p>
        </form>
        <p class="switch">New to Chatter? <a href="signup.html">Sign up</a></p>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="js/main.js"></script>
</body>
</html>
